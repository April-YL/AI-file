[project]
name = "fixed-asset-qc-agent"
version = "0.1.0"
description = "Fixed asset quality inspection agent"
readme = "AGENTS.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
llm = [
    "httpx>=0.27",
]
ui = [
    "streamlit>=1.28",
    "python-dotenv>=1.0",
]
all = [
    "pytest>=7.0",
    "httpx>=0.27",
    "streamlit>=1.28",
]

[project.scripts]
fa-qc-diagnose = "ingest.cli:main"
fa-qc-run = "report.cli:main"
fa-qc-ui = "fa_qc_ui:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["fa_qc_ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
