name: Repository Guard

on:
  pull_request:
  push:
    branches:
      - architecture-baseline

jobs:
  repo-guard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository guard
        run: python scripts/check_repo_guard.py
